 const bankKey={'1111':null,'1100':'edge_sand_top','0011':'edge_grass_top','1010':'edge_sand_left','0101':'edge_grass_left','0001':'pocket_sand_br','0010':'pocket_sand_bl','0100':'pocket_sand_tr','1000':'pocket_sand_tl','1110':'tip_grass_br','1101':'tip_grass_bl','1011':'tip_grass_tr','0111':'tip_grass_tl','1001':'sand1','0110':'sand1'};
